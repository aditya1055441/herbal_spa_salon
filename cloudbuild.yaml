steps:
  # 1. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/aura-botanica-spa:$COMMIT_SHA', '.']

  # 2. Push image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/aura-botanica-spa:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aura-botanica-spa'
      - '--image'
      - 'gcr.io/$PROJECT_ID/aura-botanica-spa:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'SQUARE_ENVIRONMENT=sandbox,SQUARE_LOCATION_ID=L_AURA_SANCTUARY_01'

images:
  - 'gcr.io/$PROJECT_ID/aura-botanica-spa:$COMMIT_SHA'
