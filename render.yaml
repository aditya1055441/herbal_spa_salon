# ==============================================================================
# Render.com Blueprint Infrastructure Specification
# https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: aura-botanica-spa
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SQUARE_ENVIRONMENT
        value: sandbox
      - key: SQUARE_LOCATION_ID
        value: L_AURA_SANCTUARY_01
